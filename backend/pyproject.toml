[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "silencio-set"
version = "0.1.0"
description = "Silencio Set local-first API and workers"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.15,<2",
  "redis>=5.2,<7",
  "aio-pika>=9.5,<10",
  "celery>=5.5,<6",
  "argon2-cffi>=25.1,<26",
  "email-validator>=2.2,<3",
  "anyio>=4.8,<5",
  "cryptography>=48,<51",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "pip-tools>=7.4,<8", "fakeredis[lua]>=2.28,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/silencio_set"]
